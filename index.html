
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gemini Paraphraser</title>
  <style>
    :root {
      font-family: Arial, Helvetica, sans-serif;
      color: #202124;
      background: #f5f7fb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header {
      padding: 24px 5%;
      background: white;
      border-bottom: 1px solid #e3e7ef;
    }
    header h1 { margin: 0 0 8px; font-size: 25px; }
    header p { margin: 0; color: #5f6368; }
    main { max-width: 1400px; margin: 28px auto; padding: 0 20px; }
    .toolbar {
      display: flex; gap: 12px; flex-wrap: wrap;
      align-items: center; margin-bottom: 20px;
    }
    select, button {
      font: inherit; border-radius: 8px;
      padding: 11px 15px; border: 1px solid #d4d9e2;
      background: white;
    }
    select { min-width: 245px; }
    button { cursor: pointer; font-weight: 600; }
    button:disabled { opacity: .55; cursor: wait; }
    .primary { background: #315bea; color: white; border-color: #315bea; }
    .panels {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .panel {
      background: white; border: 1px solid #e0e5ed;
      border-radius: 12px; overflow: hidden; min-width: 0;
    }
    .panel-head {
      display: flex; justify-content: space-between;
      gap: 10px; align-items: center;
      padding: 16px 18px; border-bottom: 1px solid #e9edf3;
    }
    .panel-head h2 { font-size: 16px; margin: 0; }
    .count { font-size: 12px; color: #6b7280; }
    textarea, #result {
      display: block; width: 100%; min-height: 360px;
      padding: 18px; border: 0; resize: vertical;
      font: 15px/1.7 Arial, Helvetica, sans-serif;
      overflow-wrap: anywhere; white-space: pre-wrap;
    }
    textarea:focus { outline: 2px solid #9bb5ff; outline-offset: -2px; }
    #result { color: #303846; }
    #result:empty::before {
      content: "Your paraphrased text will appear here.";
      color: #9aa1ad;
    }
    .panel-actions {
      display: flex; gap: 8px; flex-wrap: wrap;
      padding: 12px 16px; border-top: 1px solid #e9edf3;
    }
    #status { min-height: 24px; margin: 16px 2px; color: #525c6b; }
    .note { color: #6b7280; font-size: 12px; line-height: 1.6; }
    @media (max-width: 760px) {
      .panels { grid-template-columns: 1fr; }
      textarea, #result { min-height: 240px; }
      select { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Gemini Paraphraser</h1>
    <p>Rewrite your text while preserving its original meaning.</p>
  </header>

  <main>
    <div class="toolbar">
      <label for="mode"><strong>Writing mode:</strong></label>
      <select id="mode">
        <option value="concise">Concise and direct</option>
        <option value="casual">Natural and casual</option>
        <option value="formal">Formal / Professional</option>
        <option value="social">Social Media / Tweet Style</option>
        <option value="minimal">Ultra-Short / Minimalist</option>
      </select>
      <button class="primary" id="rewrite">Paraphrase</button>
      <button id="clear">Clear</button>
    </div>

    <div class="panels">
      <section class="panel">
        <div class="panel-head">
          <h2>Original text (English)</h2>
          <span class="count" id="inputCount">0 words</span>
        </div>
        <textarea id="source" maxlength="20000"
          placeholder="Paste or type your text here..."
          aria-label="Original text"></textarea>
        <div class="panel-actions">
          <button id="pasteHint" type="button">Select text</button>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Paraphrased result (English)</h2>
          <span class="count" id="outputCount">0 words</span>
        </div>
        <div id="result" role="region" aria-live="polite"></div>
        <div class="panel-actions">
          <button id="copy">Copy result</button>
          <button id="regenerate" class="primary">Regenerate</button>
        </div>
      </section>
    </div>

    <p id="status" role="status"></p>
    <p class="note">
      Maximum input: 20,000 characters. Review rewritten text for accuracy.
      Do not submit confidential information.
    </p>
  </main>

  <script>
    const source = document.getElementById("source");
    const result = document.getElementById("result");
    const mode = document.getElementById("mode");
    const status = document.getElementById("status");
    const rewriteButton = document.getElementById("rewrite");
    const regenerateButton = document.getElementById("regenerate");
    const copyButton = document.getElementById("copy");

    function wordCount(text) {
      const trimmed = text.trim();
      return trimmed ? trimmed.split(/\s+/).length : 0;
    }

    function updateCounts() {
      document.getElementById("inputCount").textContent =
        wordCount(source.value) + " words";
      document.getElementById("outputCount").textContent =
        wordCount(result.textContent) + " words";
    }

    source.addEventListener("input", updateCounts);

    async function paraphrase() {
      const text = source.value.trim();
      if (!text) {
        status.textContent = "Please enter some text first.";
        source.focus();
        return;
      }

      rewriteButton.disabled = true;
      regenerateButton.disabled = true;
      status.textContent = "Rewriting your text with Gemini...";
      result.textContent = "";

      try {
        const response = await fetch("/api/paraphrase", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, mode: mode.value })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "The request failed.");
        }
        result.textContent = data.result;
        status.textContent = "Paraphrasing complete.";
      } catch (error) {
        status.textContent = error.message ||
          "Unable to paraphrase. Please try again.";
      } finally {
        rewriteButton.disabled = false;
        regenerateButton.disabled = false;
        updateCounts();
      }
    }

    rewriteButton.addEventListener("click", paraphrase);
    regenerateButton.addEventListener("click", paraphrase);

    copyButton.addEventListener("click", async () => {
      const text = result.textContent.trim();
      if (!text) {
        status.textContent = "There is no result to copy.";
        return;
      }
      try {
        await navigator.clipboard.writeText(text);
        status.textContent = "Result copied to clipboard.";
      } catch {
        status.textContent =
          "Copy was blocked by the browser. Select the result and copy it manually.";
      }
    });

    document.getElementById("clear").addEventListener("click", () => {
      source.value = "";
      result.textContent = "";
      status.textContent = "";
      updateCounts();
      source.focus();
    });

    document.getElementById("pasteHint").addEventListener("click", () => {
      source.focus();
      source.select();
    });

    updateCounts();
  </script>
</body>
</html>
